<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أرشيف المستندات</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--tx:#1a1f24;--mu:#66707c;--ac:#0f766e;--acx:#fff;--bd:#e0e5ea;--dn:#b42318;--hl:#fff2a8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121518;--card:#1b2024;--tx:#e8ecef;--mu:#98a2ad;--ac:#2dd4bf;--acx:#06201c;--bd:#2c343b;--dn:#f97066;--hl:#5c4d00;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121518;--card:#1b2024;--tx:#e8ecef;--mu:#98a2ad;--ac:#2dd4bf;--acx:#06201c;--bd:#2c343b;--dn:#f97066;--hl:#5c4d00;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 18px;font-size:.95rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac)}
#q{flex:1 1 220px;font-size:1.05rem}
button{cursor:pointer}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.6;cursor:wait}
button.lnk{border:none;background:none;padding:4px 8px;color:var(--mu);font-size:.85rem}
button.lnk.dn{color:var(--dn)}
.meta{color:var(--mu);font-size:.85rem;margin:6px 2px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.card.folder{align-items:center;cursor:pointer}
.card.folder:hover{border-color:var(--ac)}
.thumb{flex:0 0 64px;height:64px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:var(--ac);overflow:hidden}
.thumb.fo{font-size:2rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{flex:1;min-width:0}
.card h3{margin:0;font-size:1.05rem;word-break:break-word}
.card h3 a{color:var(--tx);text-decoration:none}
.card h3 a:hover{color:var(--ac);text-decoration:underline}
.desc{color:var(--mu);font-size:.9rem;margin:4px 0}
.info{color:var(--mu);font-size:.8rem}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:0 8px;font-size:.78rem;color:var(--ac);margin-bottom:2px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.open{background:var(--ac);color:var(--acx);text-decoration:none;border-radius:8px;padding:4px 14px;font-size:.88rem;font-weight:600}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.form{display:none;margin-bottom:16px;flex-direction:column;gap:8px}
.form.on{display:flex}
.form .row{display:flex;gap:8px}.form .row>*{flex:1;min-width:0}
.empty,.note{text-align:center;color:var(--mu);padding:28px 8px}
.note{background:var(--card);border:1px dashed var(--bd);border-radius:12px;padding:10px;margin-bottom:12px;font-size:.85rem}
.hint{font-size:.8rem;color:var(--mu)}
.crumb{display:flex;align-items:center;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.crumb button{padding:4px 10px;font-size:.9rem}
.crumb .sep{color:var(--mu)}
.crumb .here{font-weight:700}
.sec{color:var(--mu);font-size:.85rem;margin:14px 2px 8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>أرشيف المستندات</h1>
  <p class="sub">ابحث عن المستند وافتحه بضغطة واحدة.</p>
  <div id="note" class="note" hidden></div>

  <div class="bar">
    <input id="q" type="search" placeholder="ابحث في كل الملفات بالاسم أو الوصف أو الـ ID..." autocomplete="off">
    <button id="addFolder">📁 مجلد جديد</button>
    <button class="pri" id="add">+ رفع ملف</button>
  </div>

  <!-- فورم الملف -->
  <div class="card form" id="form">
    <input id="f-file" type="file" accept="application/pdf,image/*">
    <div class="hint" id="f-hint">PDF أو صور، حتى 20 ميجابايت.</div>
    <div class="row">
      <input id="f-title" placeholder="الاسم *">
      <input id="f-file-id" placeholder="ID (مثال: 12)">
    </div>
    <select id="f-folder"></select>
    <textarea id="f-desc" placeholder="الوصف"></textarea>
    <div class="row"><button class="pri" id="save">حفظ</button><button id="cancel">إلغاء</button></div>
  </div>

  <!-- فورم المجلد (إنشاء / إعادة تسمية / نقل) -->
  <div class="card form" id="fform">
    <div class="hint" id="ff-hint">مجلد جديد</div>
    <input id="ff-name" placeholder="اسم المجلد *">
    <div class="hint">المجلد الأب (مكان المجلد):</div>
    <select id="ff-parent"></select>
    <div class="row"><button class="pri" id="ff-save">حفظ</button><button id="ff-cancel">إلغاء</button></div>
  </div>

  <div id="crumb"></div>
  <div class="meta" id="count"></div>
  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SUPABASE_URL = 'https://mdpygeqamujlfynebywu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_KpMHS25xwWbUXjXCOw4MXg_HmnVTJtK';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var rows = [], folders = [], cur = null, editing = null, editingFolder = null, armed = null, MAX = 20 * 1024 * 1024;
  var $ = function(id){ return document.getElementById(id); };

  function norm(s){
    return String(s||"").toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"")
      .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
  }
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function hl(parent,text,terms){
    var n=norm(text),ranges=[];
    terms.forEach(function(t){var i=0,p;while((p=n.indexOf(t,i))>-1){ranges.push([p,p+t.length]);i=p+t.length}});
    if(!ranges.length){parent.textContent=text;return}
    ranges.sort(function(a,b){return a[0]-b[0]});
    var c=0;
    ranges.forEach(function(r){
      if(r[0]<c)return;
      parent.appendChild(document.createTextNode(text.slice(c,r[0])));
      parent.appendChild(el("mark",null,text.slice(r[0],r[1])));c=r[1];
    });
    parent.appendChild(document.createTextNode(text.slice(c)));
  }
  function size(b){return b>1048576?(b/1048576).toFixed(1)+" م.ب":Math.max(1,Math.round(b/1024))+" ك.ب"}
  function flash(m){var n=$("note");n.textContent=m;n.hidden=false}
  function getFileUrl(id){return supabase.storage.from('assets').getPublicUrl(id).data.publicUrl}
  function isImg(r){return (r.content_type||"").indexOf("image/")===0}
  function folderById(id){
    if(id===null||id===undefined||id==="")return undefined;
    return folders.find(function(f){return String(f.id)===String(id)});
  }

  /* ===== دوال الشجرة ===== */
  // المسار من الجذر لحد المجلد (مصفوفة مجلدات)، مع حماية من الحلقات
  function pathOf(id){
    var out=[],seen={},f=folderById(id);
    while(f&&!seen[f.id]){seen[f.id]=1;out.unshift(f);f=folderById(f.parent_id)}
    return out;
  }
  function pathName(id){return pathOf(id).map(function(f){return f.name}).join(" / ")}
  // هل المجلد id هو نفسه ancestorId أو من أحفاده؟
  function isInside(id,ancestorId){
    return pathOf(id).some(function(f){return String(f.id)===String(ancestorId)});
  }
  function childFolders(id){
    return folders.filter(function(f){
      if(id===null)return !f.parent_id||!folderById(f.parent_id);
      return String(f.parent_id)===String(id);
    });
  }
  function filesIn(id){
    return rows.filter(function(r){
      if(id===null)return !r.folder_id||!folderById(r.folder_id);
      return String(r.folder_id)===String(id);
    });
  }
  // عدد الملفات داخل المجلد وكل مجلداته الفرعية
  function deepCount(id){
    var n=filesIn(id).length;
    childFolders(id).forEach(function(c){n+=deepCount(c.id)});
    return n;
  }

  async function loadAll(){
    var a = await supabase.from('records').select('*').order('ts',{ascending:false});
    if(a.error){flash("خطأ في تحميل الملفات: "+a.error.message);return}
    var b = await supabase.from('folders').select('*').order('name',{ascending:true});
    if(b.error){flash("خطأ في تحميل المجلدات (تأكد إنك شغّلت الـ SQL): "+b.error.message)}
    rows = a.data||[]; folders = b.data||[];
    if(cur!==null && !folderById(cur)) cur=null;
    render();
  }

  function rowCard(r,terms,showFolder){
    var c=el("div","card"),th=el("div","thumb");
    var fileUrl=getFileUrl(r.asset_id);
    if(isImg(r)){var im=document.createElement("img");im.loading="lazy";im.alt="";im.src=fileUrl;th.appendChild(im)}
    else th.textContent=(r.content_type==="application/pdf")?"PDF":"ملف";
    c.appendChild(th);

    var b=el("div","body");
    if(showFolder&&r.folder_id&&folderById(r.folder_id)){b.appendChild(el("div","tag","📁 "+pathName(r.folder_id)))}
    var h=el("h3");
    if(r.file_id){h.appendChild(el("span","cat","ID: "+r.file_id+" - "));h.appendChild(document.createTextNode(" "))}
    var a=document.createElement("a");
    a.href=fileUrl;a.target="_blank";a.rel="noopener";hl(a,r.title||"",terms);h.appendChild(a);
    b.appendChild(h);
    if(r.description){var d=el("div","desc");hl(d,r.description,terms);b.appendChild(d)}
    b.appendChild(el("div","info",size(r.size||0)+" · آخر تحديث "+new Date(r.ts||Date.now()).toLocaleDateString("ar-EG")));

    var ac=el("div","acts"),op=el("a","open","فتح");op.href=fileUrl;op.target="_blank";op.rel="noopener";ac.appendChild(op);
    var e=el("button","lnk","تعديل / نقل");e.onclick=function(){openForm(r)};
    var key="r"+r.id;
    var x=el("button","lnk dn",armed===key?"تأكيد الحذف؟":"حذف");
    x.onclick=function(){
      if(armed===key){armed=null;remove(r)}
      else{armed=key;render();setTimeout(function(){if(armed===key){armed=null;render()}},3000)}
    };
    ac.appendChild(e);ac.appendChild(x);
    b.appendChild(ac);c.appendChild(b);
    return c;
  }

  function folderCard(f){
    var c=el("div","card folder");
    c.appendChild(el("div","thumb fo","📁"));
    var b=el("div","body");
    b.appendChild(el("h3",null,f.name));
    var subs=childFolders(f.id).length, direct=filesIn(f.id).length, deep=deepCount(f.id);
    var info=[];
    if(subs)info.push(subs+" مجلد");
    info.push(direct+" ملف");
    if(deep!==direct)info.push("(الإجمالي "+deep+")");
    b.appendChild(el("div","info",info.join(" · ")));
    var ac=el("div","acts");
    var rn=el("button","lnk","إعادة تسمية / نقل");
    rn.onclick=function(ev){ev.stopPropagation();openFolderForm(f)};
    var key="f"+f.id;
    var x=el("button","lnk dn",armed===key?"تأكيد الحذف؟":"حذف المجلد");
    x.onclick=function(ev){
      ev.stopPropagation();
      if(armed===key){armed=null;removeFolder(f)}
      else{armed=key;render();setTimeout(function(){if(armed===key){armed=null;render()}},3000)}
    };
    ac.appendChild(rn);ac.appendChild(x);b.appendChild(ac);
    c.appendChild(b);
    c.onclick=function(){cur=f.id;$("q").value="";render()};
    return c;
  }

  function renderCrumb(){
    var crumb=$("crumb");crumb.innerHTML="";
    if(cur===null)return;
    var cr=el("div","crumb");
    var root=el("button",null,"🏠 الرئيسية");root.onclick=function(){cur=null;render()};
    cr.appendChild(root);
    var p=pathOf(cur);
    p.forEach(function(f,i){
      cr.appendChild(el("span","sep","›"));
      if(i===p.length-1){cr.appendChild(el("span","here","📁 "+f.name))}
      else{var bt=el("button",null,"📁 "+f.name);bt.onclick=function(){cur=f.id;render()};cr.appendChild(bt)}
    });
    crumb.appendChild(cr);
  }

  function render(){
    var terms=norm($("q").value).split(/\s+/).filter(Boolean);
    var list=$("list");
    list.innerHTML="";$("crumb").innerHTML="";
    var searching=terms.length>0;

    if(searching){
      var out=rows.filter(function(r){
        var hay=norm([r.title,r.file_id,r.description,r.file_Name,pathName(r.folder_id)].join(" "));
        return terms.every(function(t){return hay.indexOf(t)>-1});
      });
      $("count").textContent="نتائج البحث: "+out.length+" من "+rows.length+" ملف";
      if(!out.length)list.appendChild(el("div","empty","لا توجد نتائج مطابقة."));
      out.forEach(function(r){list.appendChild(rowCard(r,terms,true))});
      return;
    }

    renderCrumb();
    var subs=childFolders(cur), files=filesIn(cur);

    if(cur!==null){
      $("count").textContent=subs.length+" مجلد · "+files.length+" ملف في هذا المجلد";
    }else{
      $("count").textContent=folders.length+" مجلد · "+rows.length+" ملف";
    }

    if(subs.length){
      list.appendChild(el("div","sec",cur===null?"المجلدات":"المجلدات الفرعية"));
      subs.forEach(function(f){list.appendChild(folderCard(f))});
    }
    if(files.length){
      if(subs.length)list.appendChild(el("div","sec",cur===null?"ملفات بدون مجلد":"الملفات"));
      files.forEach(function(r){list.appendChild(rowCard(r,terms,false))});
    }
    if(!subs.length&&!files.length){
      list.appendChild(el("div","empty",cur===null?"لا توجد ملفات أو مجلدات بعد.":"المجلد فاضي. اضغط \"رفع ملف\" أو \"مجلد جديد\" للإضافة هنا."));
    }
  }

  /* ===== المجلدات ===== */
  // يملا قائمة اختيار المجلد الأب. excludeId = المجلد الجاري تعديله (مع أحفاده يتم استبعادهم)
  function fillParentSelect(sel,selected,excludeId,rootLabel){
    sel.innerHTML="";
    var o=el("option",null,rootLabel);o.value="";sel.appendChild(o);
    folders
      .filter(function(f){return excludeId==null||!isInside(f.id,excludeId)})
      .map(function(f){return {id:f.id,name:pathName(f.id)}})
      .sort(function(a,b){return a.name.localeCompare(b.name,"ar")})
      .forEach(function(f){var op=el("option",null,"📁 "+f.name);op.value=f.id;sel.appendChild(op)});
    sel.value=selected==null?"":String(selected);
  }

  function openFolderForm(f){
    editingFolder=f||null;
    $("ff-hint").textContent=f?"تعديل المجلد: "+f.name:"مجلد جديد";
    $("ff-name").value=f?f.name:"";
    fillParentSelect($("ff-parent"),f?f.parent_id:cur,f?f.id:null,"الرئيسية (بدون مجلد أب)");
    $("fform").classList.add("on");$("ff-name").focus();
  }
  function closeFolderForm(){$("fform").classList.remove("on");editingFolder=null}

  async function saveFolder(){
    var name=$("ff-name").value.trim();
    if(!name){$("ff-name").focus();return}
    var pv=$("ff-parent").value, parentId=pv===""?null:Number(pv);
    var btn=$("ff-save");btn.disabled=true;
    try{
      var r;
      if(editingFolder){
        if(parentId!==null&&isInside(parentId,editingFolder.id))throw new Error("مينفعش تنقل المجلد جوا نفسه.");
        r=await supabase.from('folders').update({name:name,parent_id:parentId}).eq('id',editingFolder.id);
      }else{
        r=await supabase.from('folders').insert([{name:name,parent_id:parentId,ts:Date.now()}]);
      }
      if(r.error)throw r.error;
      closeFolderForm();loadAll();
    }catch(e){flash("تعذّر حفظ المجلد: "+(e.message||"حاول مرة أخرى"))}
    finally{btn.disabled=false}
  }

  async function removeFolder(f){
    // محتويات المجلد (ملفات + مجلدات فرعية) بتتنقل للمجلد الأب، مفيش حاجة بتتمسح
    try{
      var up=f.parent_id||null;
      var a=await supabase.from('folders').update({parent_id:up}).eq('parent_id',f.id);
      if(a.error)throw a.error;
      var b=await supabase.from('records').update({folder_id:up}).eq('folder_id',f.id);
      if(b.error)throw b.error;
      var r=await supabase.from('folders').delete().eq('id',f.id);
      if(r.error)throw r.error;
      if(cur!==null&&String(cur)===String(f.id))cur=up;
      loadAll();
    }catch(e){flash("تعذّر حذف المجلد: "+(e.message||""))}
  }

  /* ===== الملفات ===== */
  function fillFolderSelect(selected){
    fillParentSelect($("f-folder"),selected,null,"بدون مجلد");
  }

  function openForm(r){
    editing=r||null;$("f-file").value="";
    $("f-title").value=r?r.title||"":"";
    $("f-file-id").value=r?r.file_id||"":"";
    $("f-desc").value=r?r.description||"":"";
    fillFolderSelect(r?r.folder_id:cur);
    $("f-hint").textContent=r?"اختر ملفًا جديدًا فقط لو عايز تستبدل الحالي ("+(r.file_Name||"")+")":"PDF أو صور، حتى 20 ميجابايت.";
    $("form").classList.add("on");$("f-title").focus();
  }
  function closeForm(){$("form").classList.remove("on");editing=null}

  $("f-file").onchange=function(){
    var f=this.files[0];
    if(f&&!$("f-title").value)$("f-title").value=f.name.replace(/\.[^.]+$/,"");
  };

  async function save(){
    var f=$("f-file").files[0], btn=$("save");
    var titleVal=$("f-title").value.trim();
    if(!titleVal){$("f-title").focus();return}
    if(!editing&&!f){flash("اختر ملفًا أولًا.");return}
    if(f&&f.size>MAX){flash("الملف أكبر من 20 ميجابايت.");return}
    btn.disabled=true;btn.textContent="جاري الحفظ…";
    try{
      var assetId=editing?editing.asset_id:null,contentType=editing?editing.content_type:null,
          sizeBytes=editing?editing.size:null,fileName=editing?editing.file_Name:null;
      if(f){
        var clean=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
        var filePath=Date.now()+'_'+clean;
        var up=await supabase.storage.from('assets').upload(filePath,f);
        if(up.error)throw up.error;
        assetId=filePath;contentType=f.type;sizeBytes=f.size;fileName=f.name;
      }
      var fv=$("f-folder").value;
      var rec={
        title:titleVal,file_id:$("f-file-id").value.trim(),description:$("f-desc").value.trim(),
        asset_id:assetId,file_Name:fileName,content_type:contentType,size:sizeBytes,
        folder_id:fv===""?null:Number(fv),ts:Date.now()
      };
      var res=editing?await supabase.from('records').update(rec).eq('id',editing.id)
                     :await supabase.from('records').insert([rec]);
      if(res.error)throw res.error;
      closeForm();loadAll();
    }catch(e){
      flash("تعذّر الحفظ: "+(e.message||"حاول مرة أخرى"));
    }finally{
      btn.disabled=false;btn.textContent="حفظ";
    }
  }

  async function remove(r){
    try{
      var d=await supabase.from('records').delete().eq('id',r.id);
      if(d.error)throw d.error;
      if(r.asset_id)await supabase.storage.from('assets').remove([r.asset_id]);
      loadAll();
    }catch(e){flash("تعذّر الحذف: "+(e.message||""))}
  }

  $("add").onclick=function(){openForm(null)};
  $("addFolder").onclick=function(){openFolderForm(null)};
  $("cancel").onclick=closeForm;$("save").onclick=save;
  $("ff-cancel").onclick=closeFolderForm;$("ff-save").onclick=saveFolder;
  $("q").oninput=render;
  loadAll();
})();
</script>
</body>
</html>
